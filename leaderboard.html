<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arena Survival - Leaderboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0808 50%, #0a0a0a 100%);
      color: #fff;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
    }

    .nav {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav .logo { color: #f44; font-size: 20px; text-decoration: none; }
    .nav .links a {
      color: #888;
      text-decoration: none;
      margin-left: 20px;
    }
    .nav .links a:hover { color: #f80; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      color: #f80;
      text-align: center;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .tab {
      padding: 12px 30px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab:hover { background: #222; color: #fff; }
    .tab.active { background: #f44; border-color: #f44; color: #fff; }

    .leaderboard {
      background: rgba(0,0,0,0.6);
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #222;
    }
    th {
      background: #1a1a1a;
      color: #f80;
      font-weight: normal;
      text-transform: uppercase;
      font-size: 12px;
    }
    tr:hover { background: rgba(255,136,0,0.1); }

    .rank { width: 60px; text-align: center; }
    .rank-1 { color: #ffd700; font-size: 20px; }
    .rank-2 { color: #c0c0c0; font-size: 18px; }
    .rank-3 { color: #cd7f32; font-size: 16px; }

    .player-name { color: #fff; }
    .level { color: #4af; }
    .score { color: #ff0; font-weight: bold; }
    .wave { color: #f80; }
    .kills { color: #f44; }
    .time { color: #888; }

    .top-player {
      display: flex;
      align-items: center;
      gap: 15px;
      background: linear-gradient(90deg, rgba(255,215,0,0.2), transparent);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #ffd700;
    }
    .top-player .crown { font-size: 48px; }
    .top-player .info h2 { color: #ffd700; margin: 0 0 5px 0; }
    .top-player .info p { color: #888; margin: 0; }
    .top-player .stats {
      margin-left: auto;
      text-align: right;
    }
    .top-player .stats .big { font-size: 32px; color: #ff0; }
    .top-player .stats .label { color: #666; font-size: 12px; }

    .empty {
      text-align: center;
      padding: 60px;
      color: #666;
    }

    .footer {
      background: #0a0a0a;
      border-top: 1px solid #222;
      padding: 20px;
      text-align: center;
      color: #444;
      font-size: 12px;
      margin-top: 40px;
    }
    .footer a { color: #666; text-decoration: none; margin: 0 10px; }
    .footer a:hover { color: #f80; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html" class="logo">⚔️ ARENA SURVIVAL</a>
    <div class="links">
      <a href="hub.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="guides.html">Guides</a>
      <a href="about.html">About</a>
    </div>
  </div>

  <div class="container">
    <h1>🏆 LEADERBOARD</h1>

    <div class="tabs">
      <div class="tab active" onclick="loadLeaderboard('score', this)">Top Score</div>
      <div class="tab" onclick="loadLeaderboard('wave', this)">Highest Wave</div>
      <div class="tab" onclick="loadLeaderboard('kills', this)">Most Kills</div>
    </div>

    <div id="topPlayer"></div>

    <div class="leaderboard">
      <table>
        <thead>
          <tr>
            <th class="rank">Rank</th>
            <th>Player</th>
            <th>Level</th>
            <th>Score</th>
            <th>Wave</th>
            <th>Kills</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">Home</a> |
    <a href="leaderboard.html">Leaderboard</a> |
    <a href="guides.html">Guides</a> |
    <a href="about.html">About</a>
  </div>

  <script src="assets/storage.js"></script>
  <script>
    let currentType = 'score';
    let useServer = false;

    async function checkServer() {
      try {
        await fetch('http://localhost:3001/api/health', { signal: AbortSignal.timeout(2000) });
        useServer = true;
      } catch {
        useServer = false;
      }
    }

    async function loadLeaderboard(type, btn) {
      currentType = type;

      if (btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
      }

      let entries = [];

      if (useServer) {
        try {
          const res = await fetch(`http://localhost:3001/api/leaderboard?type=${type}`);
          entries = await res.json();
        } catch {
          entries = Storage.getLeaderboard(type);
        }
      } else {
        entries = Storage.getLeaderboard(type);
      }

      if (entries.length === 0) {
        document.getElementById('topPlayer').innerHTML = `
          <div style="text-align:center;color:#666;padding:20px;">
            ${useServer ? '' : '<small style="color:#f80;">LOCAL MODE</small><br>'}
            No entries yet. Play a game to see your scores here!
          </div>
        `;
        document.getElementById('leaderboardBody').innerHTML = `
          <tr><td colspan="7" class="empty">No entries yet. Be the first to play!</td></tr>
        `;
        return;
      }

      // Top player highlight
      const top = entries[0];
      const typeLabels = { score: 'Score', wave: 'Wave', kills: 'Kills' };
      const topValue = type === 'score' ? top.score : type === 'wave' ? top.wave : top.kills;
      document.getElementById('topPlayer').innerHTML = `
        ${useServer ? '' : '<div style="text-align:center;color:#f80;font-size:12px;margin-bottom:10px;">LOCAL LEADERBOARD</div>'}
        <div class="top-player">
          <div class="crown">👑</div>
          <div class="info">
            <h2>${top.username || 'Player'}</h2>
            <p>Level ${top.level || 1} Warrior</p>
          </div>
          <div class="stats">
            <div class="big">${(topValue || 0).toLocaleString()}</div>
            <div class="label">TOP ${typeLabels[type].toUpperCase()}</div>
          </div>
        </div>
      `;

      // Leaderboard table
      document.getElementById('leaderboardBody').innerHTML = entries.slice(0, 100).map((e, i) => {
        const rank = i + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        const rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const timeVal = e.time_seconds || e.time || 0;
        const mins = Math.floor(timeVal / 60);
        const secs = timeVal % 60;
        const time = `${mins}:${String(secs).padStart(2, '0')}`;

        return `
          <tr>
            <td class="rank ${rankClass}">${rankDisplay}</td>
            <td class="player-name">${e.username || 'Player'}</td>
            <td class="level">${e.level || 1}</td>
            <td class="score">${(e.score || 0).toLocaleString()}</td>
            <td class="wave">${e.wave || 1}</td>
            <td class="kills">${e.kills || 0}</td>
            <td class="time">${time}</td>
          </tr>
        `;
      }).join('');
    }

    // Init
    checkServer().then(() => loadLeaderboard('score'));
  </script>
</body>
</html>
