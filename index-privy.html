<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Arena Survival - MegaETH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1010 50%, #0a0a0a 100%);
      min-height: 100vh;
      overflow-x: hidden;
      overscroll-behavior: none;
    }
    #root {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Load game assets after React mounts -->
  <script>
    // Wait for Privy connection, then init game
    window.addEventListener('privy-connected', (e) => {
      console.log('Game: Privy connected, address:', e.detail.address);
      // Game will use window.PrivyWallet for transactions
    });
  </script>

  <!-- Game scripts (loaded after React) -->
  <script src="assets/storage.js" defer></script>
  <script src="assets/rot.js" defer></script>
  <script src="assets/tilemap.js" defer></script>
  <script src="assets/megaeth.js" defer></script>
  <script src="assets/arena.js" defer></script>
</body>
</html>
